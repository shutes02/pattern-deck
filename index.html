<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --paper: #eee9de;
    --paper-2: #e4ded0;
    --surface: #fffdf8;
    --ink: #262218;
    --ink-soft: #6b6353;
    --line: #cdc3ac;
    --line-strong: #a89c81;
    --accent: #38466b;
    --accent-soft: #38466b1a;
    --olive: #5f6b3f;
    --olive-soft: #5f6b3f1a;
    --danger: #8a3b2f;
    --shadow: rgba(38, 34, 24, 0.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1a15;
      --paper-2: #242018;
      --surface: #2a261e;
      --ink: #ece6d8;
      --ink-soft: #a89c81;
      --line: #45402f;
      --line-strong: #5c5540;
      --accent: #8fa3d1;
      --accent-soft: #8fa3d11f;
      --olive: #a3b37c;
      --olive-soft: #a3b37c1f;
      --danger: #d98f7e;
      --shadow: rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1a15; --paper-2: #242018; --surface: #2a261e; --ink: #ece6d8;
    --ink-soft: #a89c81; --line: #45402f; --line-strong: #5c5540; --accent: #8fa3d1;
    --accent-soft: #8fa3d11f; --olive: #a3b37c; --olive-soft: #a3b37c1f;
    --danger: #d98f7e; --shadow: rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 18px 50px; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--paper); padding: 18px 18px 10px; max-width: 480px; margin: 0 auto;
  }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.2px; margin: 0; }
  .count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); text-align: right; }
  nav.tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--line); }
  nav.tabs button {
    appearance: none; background: none; border: none; font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px; letter-spacing: 0.3px; color: var(--ink-soft); padding: 8px 4px 10px;
    margin-right: 18px; cursor: pointer; border-bottom: 2px solid transparent; transform: translateY(1px);
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding-top: 18px; }
  section { display: none; }
  section.active { display: block; }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty .big { font-size: 15px; color: var(--ink); margin-bottom: 6px; }
  .empty .small { font-family: "IBM Plex Mono", monospace; font-size: 12px; }

  /* ---- shared: fields / uploads (Add Phrase form) ---- */
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px;
    letter-spacing: 0.3px; color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input[type="text"] {
    width: 100%; font-family: "Source Serif 4", Georgia, serif; font-size: 16px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 3px; padding: 10px 12px;
  }
  .mode-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
  .mode-toggle button {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; padding: 8px 16px; border: 1px solid var(--line-strong);
    border-radius: 20px; background: none; color: var(--ink-soft); cursor: pointer; flex: 1;
  }
  .mode-toggle button.active { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
  .add-back-link {
    display: block; margin: 10px auto 0; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: var(--ink-soft); background: none; border: none; text-decoration: underline;
    text-underline-offset: 3px; cursor: pointer; padding: 4px;
  }
  .upload-box {
    aspect-ratio: 148/105; border: 1.5px dashed var(--line-strong); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; position: relative;
    overflow: hidden; background: var(--surface); cursor: pointer;
  }
  .upload-box img { width: 100%; height: 100%; object-fit: cover; }
  .upload-box .plus { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.5; }
  .upload-box input { display: none; }
  .upload-label { font-family: "IBM Plex Mono", monospace; font-size: 10px; text-align: center; color: var(--ink-soft); margin-top: 6px; }
  .upload-cols { display: flex; gap: 10px; }
  .upload-col { flex: 1; }
  .save-row { margin-top: 26px; }
  .save-row button.primary { width: 100%; padding: 13px; }
  button.primary {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; letter-spacing: 0.3px;
    background: var(--accent); color: var(--paper); border: none; padding: 12px 22px;
    border-radius: 3px; cursor: pointer;
  }
  button.ghost {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; background: none;
    border: 1px solid var(--line-strong); color: var(--ink); padding: 12px 18px; border-radius: 3px; cursor: pointer;
  }

  /* ---- phrase list ---- */
  .phrase-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .phrase-controls input {
    flex: 1; font-size: 13.5px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 3px; padding: 9px 10px;
  }
  .sort-toggle { display: flex; gap: 4px; flex-shrink: 0; }
  .sort-toggle button {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; background: none;
    border: 1px solid var(--line); color: var(--ink-soft); padding: 6px 9px; border-radius: 20px; cursor: pointer;
  }
  .sort-toggle button.active { color: var(--ink); border-color: var(--accent); }
  .list-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
  .thumb { width: 60px; height: 42px; flex-shrink: 0; border: 1px solid var(--line-strong); border-radius: 2px; overflow: hidden; background: var(--surface); display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 15.5px; font-weight: 600; }
  .row-from { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-count { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--accent); margin-top: 3px; }

  /* ---- phrase detail ---- */
  .detail-back {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-soft);
    background: none; border: none; padding: 0 0 14px; cursor: pointer;
  }
  .detail-imgs { display: flex; gap: 10px; margin-bottom: 16px; }
  .face-static {
    flex: 1; aspect-ratio: 148/105; border: 1px solid var(--line-strong); border-radius: 3px;
    overflow: hidden; background: var(--surface); cursor: zoom-in;
  }
  .face-static img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta-name { font-size: 19px; font-weight: 600; }
  .meta-from { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 12px; }
  .section-head .st { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.4px; color: var(--ink-soft); text-transform: uppercase; }
  .combo-wrap { border: 1px solid var(--line); border-radius: 5px; padding: 16px 14px; background: var(--paper-2); }
  .combo-chart-block { padding-bottom: 8px; border-bottom: 1px dashed var(--line-strong); margin-bottom: 4px; }
  .reroll-btn {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--accent); background: none;
    border: none; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0;
  }
  .quick-add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .quick-add-row input { flex: 1; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 3px; padding: 9px 10px; }
  .quick-add-row button {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; background: var(--accent); color: var(--paper);
    border: none; border-radius: 3px; padding: 0 16px; cursor: pointer;
  }
  .danger-row { margin-top: 30px; text-align: center; }
  .danger-link {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--danger); background: none;
    border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---- motif accordion (used in Phrase detail AND Practice) ---- */
  .motif-block { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; overflow: hidden; background: var(--surface); }
  .motif-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; user-select: none; }
  .motif-head .mname { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .motif-head .mcount { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; }
  .motif-head .chev { font-size: 10px; color: var(--ink-soft); transition: transform 0.2s; }
  .motif-head.open .chev { transform: rotate(180deg); }
  .motif-panel { display: none; padding: 0 14px 16px; border-top: 1px solid var(--line); }
  .motif-panel.open { display: block; }

  .provenance { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-soft); text-align: center; margin-bottom: 8px; }

  .motif-image-box {
    width: 100%; max-height: 260px; min-height: 90px; border: 1px solid var(--line-strong); border-radius: 3px;
    background: var(--paper-2); display: flex; align-items: center; justify-content: center; overflow: hidden;
    margin-bottom: 8px;
  }
  .motif-image-box[data-role="motif-image"] { cursor: zoom-in; }
  .motif-image-box img { max-width: 100%; max-height: 260px; object-fit: contain; display: block; }
  .motif-image-box .placeholder { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); text-align: center; padding: 20px; }

  .attach-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
  .attach-row .link-btn, .attach-toggle {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--accent); background: none;
    border: none; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .attach-row .link-btn.muted { color: var(--ink-soft); }
  .attach-toggle .chev { font-size: 8px; transition: transform 0.2s; }
  .attach-toggle.open .chev { transform: rotate(180deg); }
  .attached-files-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .file-line {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--accent); background: none;
    border: none; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; text-align: left; align-self: flex-start;
  }

  .chips { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .chip {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; padding: 7px 11px; border: 1px solid var(--line-strong);
    border-radius: 20px; color: var(--ink-soft); cursor: pointer; user-select: none; background: var(--surface);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip.on { color: var(--olive); border-color: var(--olive); background: var(--olive-soft); }

  .landings-block { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  .landings-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .landings-title { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.3px; color: var(--ink-soft); }
  .landings-count { font-size: 13px; color: var(--ink); }
  .landing-add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .landing-add-row input { flex: 1; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 3px; padding: 9px 10px; }
  .landing-add-row button {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; background: var(--accent); color: var(--paper);
    border: none; border-radius: 3px; padding: 0 16px; cursor: pointer;
  }
  .landing-item { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .landing-item .lrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .landing-item .lrow > .ltext { flex: 1; min-width: 100px; }
  .landing-item .ldate { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-soft); white-space: nowrap; }
  .ltally { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .tallybtn {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--olive); background: var(--olive-soft);
    border: 1px solid var(--olive); border-radius: 10px; cursor: pointer; padding: 1px 7px;
  }
  .tallybtn.minus { color: var(--ink-soft); background: none; border-color: var(--line-strong); }
  .lremove {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-soft); background: none;
    border: none; cursor: pointer; padding: 0;
  }
  .lremove.armed, .danger-link.armed { color: var(--danger); font-weight: 600; }
  .landings-empty { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-soft); padding: 6px 0; }

  .practice-controls { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
  .pull-size { display: flex; justify-content: center; gap: 8px; margin-top: 18px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft); }
  .pull-size button { background: none; border: 1px solid var(--line); color: var(--ink-soft); padding: 5px 10px; border-radius: 20px; cursor: pointer; }
  .pull-size button.active { color: var(--ink); border-color: var(--accent); }
  .second-card { margin-top: 30px; }

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--paper);
    font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 10px 16px; border-radius: 4px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  ::selection { background: var(--accent-soft); }
</style>
</head>
<body>

<header class="top">
  <div class="title-row">
    <h1>Pattern Deck</h1>
    <span class="count mono" id="deckCount">0 phrases</span>
  </div>
  <nav class="tabs">
    <button data-tab="practice" class="active">practice</button>
    <button data-tab="phrases">phrases</button>
    <button data-tab="charts">charts</button>
    <button data-tab="add">add</button>
  </nav>
</header>

<main class="wrap">

  <!-- PRACTICE -->
  <section id="practice" class="active">
    <div class="deck-area" id="practiceArea"></div>
  </section>

  <!-- PHRASES LIST -->
  <section id="phrases">
    <div class="phrase-controls" id="phraseControlsRow">
      <input type="text" id="phraseSearchInput" class="mono" placeholder="search phrases&hellip;">
      <div class="sort-toggle">
        <button type="button" data-sort="recent" class="active">recent</button>
        <button type="button" data-sort="az">a&ndash;z</button>
      </div>
    </div>
    <div id="phraseListArea"></div>
  </section>

  <!-- ADD PHRASE -->
  <section id="add">
    <div class="mode-toggle" id="addTypeToggle">
      <button type="button" data-type="phrase" class="active">phrase</button>
      <button type="button" data-type="chart">chart</button>
    </div>

    <div id="addPhraseForm">
      <div class="field">
        <label>phrase scan</label>
        <div class="upload-box" id="frontBox">
          <img id="frontPreviewImg" alt="front preview" style="display:none;">
          <span class="plus" id="frontPlus">+<br>upload scan<br>(PDF or photo)</span>
          <input type="file" id="frontInput" accept="application/pdf,.pdf,image/*">
        </div>
        <button type="button" class="add-back-link" id="addBackLink">+ add a back scan (optional)</button>
        <div id="backUploadWrap" style="display:none; margin-top:10px;">
          <div class="upload-box" id="backBox">
            <img id="backPreviewImg" alt="back preview" style="display:none;">
            <span class="plus" id="backPlus">+<br>upload back<br>(PDF or photo)</span>
            <input type="file" id="backInput" accept="application/pdf,.pdf,image/*">
          </div>
        </div>
      </div>
      <div class="field">
        <label>phrase name</label>
        <input type="text" id="nameInput" placeholder="e.g. Autumn Leaves, bar 5 turnaround">
      </div>
      <div class="save-row">
        <button class="primary" id="saveBtn">Save phrase</button>
      </div>
    </div>

    <div id="addChartForm" style="display:none;">
      <div class="field">
        <label>chart scan</label>
        <div class="upload-box" id="chartUploadBox" style="aspect-ratio:auto; height:90px;">
          <span class="plus" id="chartUploadPlus">+<br>upload chart (PDF or photo)</span>
        </div>
      </div>
      <div id="chartPendingWrap" style="display:none;">
        <div class="attach-row" style="margin-bottom:8px;"><span class="mono" id="chartPendingLabel"></span></div>
        <div class="field">
          <label>chart name</label>
          <input type="text" id="chartNameInput" placeholder="e.g. Autumn Leaves changes">
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" id="chartSaveBtn" class="primary" style="flex:1;">save chart</button>
          <button type="button" id="chartCancelBtn" class="ghost">cancel</button>
        </div>
      </div>
    </div>
  </section>

  <!-- CHARTS LIST -->
  <section id="charts">
    <div class="phrase-controls" id="chartControlsRow">
      <input type="text" id="chartSearchInput" class="mono" placeholder="search charts&hellip;">
      <div class="sort-toggle">
        <button type="button" data-sort="recent" class="active">recent</button>
        <button type="button" data-sort="az">a&ndash;z</button>
      </div>
    </div>
    <div id="chartListArea"></div>
  </section>

  <!-- CHART DETAIL -->
  <section id="chartDetail">
    <button class="detail-back" id="chartDetailBack">&larr; charts</button>
    <div class="meta-name" id="chartDetailName" style="margin-bottom:14px;"></div>
    <div class="motif-image-box" id="chartDetailMainImage" style="cursor:zoom-in;"></div>
    <div id="chartDetailExtraPages"></div>
    <div class="danger-row">
      <button class="danger-link" id="deleteChartBtn">delete this chart</button>
    </div>
  </section>

  <!-- PHRASE DETAIL -->
  <section id="phraseDetail">
    <button class="detail-back" id="detailBack">&larr; phrases</button>
    <div class="detail-imgs" id="phraseImgsWrap" style="display:none;">
      <div class="face-static"><img id="detailFront" alt="front"></div>
      <div class="face-static" id="detailBackWrap"><img id="detailBack2" alt="back"></div>
    </div>
    <div class="meta-name" id="detailName"></div>
    <div class="meta-from mono" id="detailFrom"></div>

    <div class="section-head">
      <span class="st">motifs</span>
    </div>
    <div class="quick-add-row" id="motifQuickAddRow">
      <button type="button" id="motifUploadBtn" class="primary" style="width:100%;">+ add motif (upload scan)</button>
    </div>
    <div id="motifPendingWrap" style="display:none; margin-bottom:16px;">
      <div class="attach-row" style="margin-bottom:8px;"><span class="mono" id="motifPendingLabel"></span></div>
      <input type="text" id="motifNameInput" placeholder="name this motif">
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button type="button" id="motifSaveBtn" class="primary" style="flex:1;">save motif</button>
        <button type="button" id="motifCancelBtn" class="ghost">cancel</button>
      </div>
    </div>
    <button type="button" class="add-back-link" id="motifNoFileLink">or add a motif without a scan yet</button>
    <div id="motifNoFileWrap" style="display:none; margin-top:10px;">
      <div class="quick-add-row">
        <input type="text" id="motifNoFileNameInput" placeholder="motif name (optional)">
        <button type="button" id="motifNoFileAddBtn">add</button>
      </div>
    </div>
    <div id="motifsList"></div>

    <div class="danger-row">
      <button class="danger-link" id="deletePhraseBtn">delete this phrase</button>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>
<input type="file" id="sharedFileInput" accept="application/pdf,.pdf,image/*" style="display:none;">

<script>
(function () {
  "use strict";

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  // ---------- IndexedDB ----------
  var DB_NAME = "pattern_deck_db";
  var STORE = "cards"; // kept as-is so existing data (pre-restructure) is found & migrated
  var CHART_STORE = "charts";
  var db = null;

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 2);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
        if (!d.objectStoreNames.contains(CHART_STORE)) d.createObjectStore(CHART_STORE, { keyPath: "id" });
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function txStore(storeName, mode) { return db.transaction(storeName, mode).objectStore(storeName); }
  function dbGetAll(storeName) {
    return new Promise(function (resolve, reject) {
      try {
        var req = txStore(storeName, "readonly").getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { reject(req.error); };
      } catch (err) { reject(err); }
    });
  }
  function dbPut(obj, storeName) {
    storeName = storeName || STORE;
    return new Promise(function (resolve, reject) {
      try {
        var req = txStore(storeName, "readwrite").put(obj);
        req.onsuccess = function () { resolve(); };
        req.onerror = function () { reject(req.error); };
      } catch (err) { reject(err); }
    });
  }
  function dbDelete(id, storeName) {
    storeName = storeName || STORE;
    return new Promise(function (resolve, reject) {
      try {
        var req = txStore(storeName, "readwrite").delete(id);
        req.onsuccess = function () { resolve(); };
        req.onerror = function () { reject(req.error); };
      } catch (err) { reject(err); }
    });
  }

  // ---------- migration: old flat "card" docs -> Phrase{motifs:[...]} ----------
  function migrateToPhrase(item) {
    if (item.motifs) return item;
    var legacyLandings = item.landings || [];
    var motif = {
      id: "motif_" + item.id,
      name: item.name || "motif 1",
      images: item.front ? [item.front] : (item.back ? [item.back] : []),
      fileName: null,
      keysClean: !!item.keysClean,
      unprompted: !!item.unprompted,
      landings: legacyLandings,
      createdAt: item.createdAt || Date.now()
    };
    return {
      id: item.id,
      name: item.name || "",
      from: item.from || "",
      front: item.front || null,
      back: item.back || null,
      createdAt: item.createdAt || Date.now(),
      motifs: [motif]
    };
  }

  // ---------- state ----------
  var phrases = [];
  var charts = [];
  var pullSize = 1;
  var currentPull = []; // array of {phraseId, motifId}
  var pendingFront = null, pendingBack = null;
  var activeTab = "practice";
  var currentPhraseId = null;
  var pendingAttachResolve = null;
  var phraseSearchQuery = "";
  var phraseSortMode = "recent";

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1600);
  }

  function findPhrase(id) { return phrases.find(function (p) { return p.id === id; }); }
  function findMotif(phrase, id) { return (phrase && phrase.motifs || []).find(function (m) { return m.id === id; }); }
  function findLanding(motif, at) { return (motif && motif.landings || []).find(function (l) { return l.at === at; }); }
  function findChart(id) { return charts.find(function (c) { return c.id === id; }); }

  // Two-tap confirm (avoids window.confirm(), which some embedded/sandboxed
  // viewers silently block, making destructive buttons look "dead").
  function confirmClick(btn, armedLabel, action) {
    if (btn.getAttribute("data-armed") === "1") {
      clearTimeout(btn._armTimer);
      btn.removeAttribute("data-armed");
      btn.textContent = btn.getAttribute("data-orig-text") || btn.textContent;
      btn.classList.remove("armed");
      action();
    } else {
      btn.setAttribute("data-orig-text", btn.textContent);
      btn.setAttribute("data-armed", "1");
      btn.textContent = armedLabel;
      btn.classList.add("armed");
      btn._armTimer = setTimeout(function () {
        btn.removeAttribute("data-armed");
        btn.textContent = btn.getAttribute("data-orig-text");
        btn.classList.remove("armed");
      }, 4000);
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function formatShortDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(2);
  }
  function landingTally(l) { return (l && l.count) || 1; }

  // ---------- image helpers ----------
  function fileToCompressedDataURL(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(reader.error); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("bad image")); };
        img.onload = function () {
          var maxDim = 1000;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var cw = Math.round(img.width * scale), ch = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function downscaleCanvasToDataUrl(canvas, maxDim) {
    var scale = Math.min(1, maxDim / Math.max(canvas.width, canvas.height));
    if (scale >= 1) return canvas.toDataURL("image/jpeg", 0.85);
    var cw = Math.round(canvas.width * scale), ch = Math.round(canvas.height * scale);
    var c2 = document.createElement("canvas");
    c2.width = cw; c2.height = ch;
    c2.getContext("2d").drawImage(canvas, 0, 0, cw, ch);
    return c2.toDataURL("image/jpeg", 0.85);
  }
  function renderPdfPageToDataUrl(pdf, pageNum) {
    return pdf.getPage(pageNum).then(function (page) {
      var viewport = page.getViewport({ scale: 2 });
      var canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      var ctx = canvas.getContext("2d");
      return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
        return downscaleCanvasToDataUrl(canvas, 1000);
      });
    });
  }
  var MAX_ATTACH_PAGES = 20;
  function renderAllPdfPagesToDataUrls(pdf) {
    var n = Math.min(pdf.numPages, MAX_ATTACH_PAGES);
    var tasks = [];
    for (var p = 1; p <= n; p++) tasks.push(renderPdfPageToDataUrl(pdf, p));
    return Promise.all(tasks);
  }
  function isPdfFile(file) { return file.type === "application/pdf" || /\.pdf$/i.test(file.name || ""); }

  function openImageNewTab(dataUrl) {
    if (!dataUrl) return;
    try {
      var parts = dataUrl.split(",");
      var mimeMatch = parts[0].match(/:(.*?);/);
      var mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
      var bstr = atob(parts[1]);
      var n = bstr.length;
      var u8arr = new Uint8Array(n);
      while (n--) { u8arr[n] = bstr.charCodeAt(n); }
      var blob = new Blob([u8arr], { type: mime });
      var url = URL.createObjectURL(blob);
      var win = window.open(url, "_blank");
      if (!win) toast("allow pop-ups to view full size");
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    } catch (err) {
      window.open(dataUrl, "_blank");
    }
  }

  // ---------- shared file picker (used for phrase scan, motif scan, landing attachment) ----------
  var sharedFileInput = document.getElementById("sharedFileInput");
  function pickFile(onResolve) {
    pendingAttachResolve = onResolve;
    sharedFileInput.value = "";
    sharedFileInput.click();
  }
  sharedFileInput.addEventListener("change", function () {
    var file = sharedFileInput.files[0];
    var resolve = pendingAttachResolve;
    pendingAttachResolve = null;
    if (!file || !resolve) return;
    var fileName = file.name || "";
    if (isPdfFile(file)) {
      if (!window.pdfjsLib) { toast("PDF reader didn't load \u2014 try a photo instead"); return; }
      toast("reading PDF\u2026");
      var reader = new FileReader();
      reader.onerror = function () { toast("couldn't read that file"); };
      reader.onload = function () {
        var typedarray = new Uint8Array(reader.result);
        pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
          return renderAllPdfPagesToDataUrls(pdf).then(function (urls) { resolve(urls, fileName); });
        }).catch(function (err) { console.error(err); toast("couldn't read that PDF"); });
      };
      reader.readAsArrayBuffer(file);
    } else {
      fileToCompressedDataURL(file).then(function (url) { resolve([url], fileName); })
        .catch(function () { toast("couldn't read that photo"); });
    }
  });

  // ---------- tabs ----------
  var tabButtons = document.querySelectorAll("nav.tabs button");
  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () { switchTab(btn.getAttribute("data-tab")); });
  });
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll("main > section").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById(tab === "phraseDetail" ? "phraseDetail" : tab).classList.add("active");
    tabButtons.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === tab); });
    if (tab === "practice") renderPractice();
    if (tab === "phrases") renderPhraseList();
    if (tab === "charts") renderChartList();
  }

  document.getElementById("phraseSearchInput").addEventListener("input", function () {
    phraseSearchQuery = this.value;
    renderPhraseList();
  });
  document.querySelectorAll("#phraseControlsRow .sort-toggle button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      phraseSortMode = btn.getAttribute("data-sort");
      document.querySelectorAll("#phraseControlsRow .sort-toggle button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderPhraseList();
    });
  });

  var chartSearchQuery = "";
  var chartSortMode = "recent";
  document.getElementById("chartSearchInput").addEventListener("input", function () {
    chartSearchQuery = this.value;
    renderChartList();
  });
  document.querySelectorAll("#chartControlsRow .sort-toggle button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      chartSortMode = btn.getAttribute("data-sort");
      document.querySelectorAll("#chartControlsRow .sort-toggle button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderChartList();
    });
  });

  function renderCount() {
    var motifCount = 0;
    phrases.forEach(function (p) { motifCount += (p.motifs || []).length; });
    document.getElementById("deckCount").textContent =
      phrases.length + (phrases.length === 1 ? " phrase" : " phrases") + " \u00b7 " +
      motifCount + (motifCount === 1 ? " motif" : " motifs") + " \u00b7 " +
      charts.length + (charts.length === 1 ? " chart" : " charts");
  }

  // =========================================================
  // MOTIF PANEL (shared builder: used in Phrase Detail accordion AND Practice)
  // =========================================================
  function buildMotifFileControlsHTML(motif) {
    var imgs = motif.images || [];
    var imageBox = "", extraPages = "", fileAction = "";
    if (imgs.length) {
      imageBox = '<div class="motif-image-box" data-role="motif-image" data-idx="0"><img src="' + imgs[0] + '" alt="motif scan"></div>';
      if (imgs.length > 1) {
        extraPages = '<div class="attached-files-list">' +
          imgs.slice(1).map(function (u, i) {
            var idx = i + 1;
            var label = motif.fileName ? motif.fileName + " \u00b7 p" + (idx + 1) : "p" + (idx + 1);
            return '<button type="button" class="file-line" data-role="motiffile-open" data-idx="' + idx + '">' + escapeHtml(label) + '</button>';
          }).join("") + "</div>";
      }
      fileAction = '<button type="button" class="link-btn" data-role="motiffile-attach">replace scan</button>' +
        '<button type="button" class="link-btn muted" data-role="motiffile-remove">remove file</button>';
    } else {
      imageBox = '<div class="motif-image-box"><span class="placeholder">no scan yet</span></div>';
      fileAction = '<button type="button" class="link-btn" data-role="motiffile-attach">attach scan</button>';
    }
    return imageBox + extraPages + '<div class="attach-row">' + fileAction + '</div>';
  }

  function buildLandingsListHTML(motif) {
    var landings = (motif.landings || []).slice().sort(function (a, b) { return b.at - a.at; });
    if (landings.length === 0) return '<div class="landings-empty">no landings logged yet</div>';
    return landings.map(function (l) {
      var imgs = l.images || (l.image ? [l.image] : []);
      var dateStr = formatShortDate(l.at);
      var tally = landingTally(l);
      var toggle = "", fileAction = "", strip = "";
      if (imgs.length) {
        toggle = '<button type="button" class="attach-toggle" data-role="lfile-toggle" data-at="' + l.at + '">' +
          (imgs.length > 1 ? imgs.length + " pages" : "preview") + ' <span class="chev">&#9662;</span></button>';
        fileAction = '<button type="button" class="link-btn muted" data-role="lfile-remove" data-at="' + l.at + '">remove file</button>';
        strip = '<div class="attached-files-list" data-role="lfile-list" data-at="' + l.at + '" style="display:none;">' +
          imgs.map(function (u, i) {
            var label = l.fileName ? l.fileName + (imgs.length > 1 ? " \u00b7 p" + (i + 1) : "") : "p" + (i + 1);
            return '<button type="button" class="file-line" data-role="lfile-open" data-at="' + l.at + '" data-idx="' + i + '">' + escapeHtml(label) + '</button>';
          }).join("") + "</div>";
      } else {
        fileAction = '<button type="button" class="link-btn" data-role="lfile-attach" data-at="' + l.at + '">attach file</button>';
      }
      return (
        '<div class="landing-item" data-at="' + l.at + '">' +
        '<div class="lrow"><span class="ltext">' + escapeHtml(l.text) + '</span>' +
        '<span class="ldate">' + dateStr + '</span>' +
        '<span class="ltally mono">&times;' + tally + '</span>' +
        '<button type="button" class="tallybtn" data-role="tally-plus" data-at="' + l.at + '">+1</button>' +
        '<button type="button" class="tallybtn minus" data-role="tally-minus" data-at="' + l.at + '">-1</button>' +
        '<button type="button" class="lremove" data-role="landing-remove" data-at="' + l.at + '">remove</button>' +
        "</div>" +
        '<div class="attach-row">' + toggle + fileAction + '</div>' +
        strip +
        "</div>"
      );
    }).join("");
  }

  function buildMotifPanelHTML(motif) {
    var landingCount = (motif.landings || []).length;
    return (
      buildMotifFileControlsHTML(motif) +
      '<div class="chips">' +
      '<div class="chip keys ' + (motif.keysClean ? "on" : "") + '" data-role="chip-keys">12 keys clean</div>' +
      '<div class="chip unprompted ' + (motif.unprompted ? "on" : "") + '" data-role="chip-unprompted">showed up unprompted</div>' +
      "</div>" +
      '<div class="landings-block">' +
      '<div class="landings-head"><span class="landings-title">landed in</span><span class="landings-count mono" data-role="landings-count">' + landingCount + '</span></div>' +
      '<div class="landing-add-row"><input type="text" data-role="landing-input" class="mono" placeholder="tune + spot"><button type="button" data-role="landing-add">add</button></div>' +
      '<div data-role="landings-list">' + buildLandingsListHTML(motif) + '</div>' +
      "</div>"
    );
  }

  // Wires all interactions inside a rendered motif panel element.
  // getMotif() must return the *current* motif object (re-fetched, since arrays get replaced).
  function wireMotifPanel(panelEl, phrase, getMotif, onChange) {
    function refresh() {
      var motif = getMotif();
      panelEl.innerHTML = buildMotifPanelHTML(motif);
      wire();
      if (onChange) onChange();
    }
    function save(then) {
      dbPut(phrase).then(function () { if (then) then(); }).catch(function () { toast("couldn't save"); });
    }
    function wire() {
      var motif = getMotif();

      var imageBox = panelEl.querySelector('[data-role="motif-image"]');
      if (imageBox) imageBox.addEventListener("click", function (e) {
        e.stopPropagation();
        var m = getMotif();
        if (m.images && m.images[0]) openImageNewTab(m.images[0]);
      });
      panelEl.querySelectorAll('[data-role="motiffile-open"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var m = getMotif();
          if (m.images && m.images[idx]) openImageNewTab(m.images[idx]);
        });
      });
      var fileAttach = panelEl.querySelector('[data-role="motiffile-attach"]');
      if (fileAttach) fileAttach.addEventListener("click", function (e) {
        e.stopPropagation();
        pickFile(function (urls, fileName) {
          var m = getMotif();
          m.images = urls; m.fileName = fileName;
          save(function () { toast(urls.length > 1 ? "attached (" + urls.length + " pages)" : "attached"); refresh(); });
        });
      });
      var fileRemove = panelEl.querySelector('[data-role="motiffile-remove"]');
      if (fileRemove) fileRemove.addEventListener("click", function (e) {
        e.stopPropagation();
        var m = getMotif();
        m.images = []; m.fileName = null;
        save(function () { toast("file removed"); refresh(); });
      });

      var chipKeys = panelEl.querySelector('[data-role="chip-keys"]');
      chipKeys.addEventListener("click", function (e) {
        e.stopPropagation();
        var m = getMotif();
        m.keysClean = !m.keysClean;
        chipKeys.classList.toggle("on", m.keysClean);
        save();
      });
      var chipUnprompted = panelEl.querySelector('[data-role="chip-unprompted"]');
      chipUnprompted.addEventListener("click", function (e) {
        e.stopPropagation();
        var m = getMotif();
        m.unprompted = !m.unprompted;
        chipUnprompted.classList.toggle("on", m.unprompted);
        save();
      });

      var addBtn = panelEl.querySelector('[data-role="landing-add"]');
      var addInput = panelEl.querySelector('[data-role="landing-input"]');
      addInput.addEventListener("click", function (e) { e.stopPropagation(); });
      function doAdd(e) {
        e.stopPropagation();
        var text = addInput.value.trim();
        if (!text) return;
        var m = getMotif();
        m.landings = m.landings || [];
        m.landings.push({ text: text, at: Date.now(), images: [], fileName: null, count: 1 });
        save(function () { toast("landing added"); refresh(); });
      }
      addBtn.addEventListener("click", doAdd);
      addInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doAdd(e); } });

      panelEl.querySelectorAll('[data-role="tally-plus"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = parseFloat(btn.getAttribute("data-at"));
          var l = findLanding(getMotif(), at);
          if (!l) return;
          l.count = landingTally(l) + 1;
          save(function () { toast("logged another rep"); refresh(); });
        });
      });
      panelEl.querySelectorAll('[data-role="tally-minus"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = parseFloat(btn.getAttribute("data-at"));
          var l = findLanding(getMotif(), at);
          if (!l) return;
          l.count = Math.max(1, landingTally(l) - 1);
          save(function () { toast("removed a rep"); refresh(); });
        });
      });
      panelEl.querySelectorAll('[data-role="landing-remove"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = parseFloat(btn.getAttribute("data-at"));
          var m = getMotif();
          m.landings = (m.landings || []).filter(function (l) { return l.at !== at; });
          save(function () { toast("landing removed"); refresh(); });
        });
      });
      panelEl.querySelectorAll('[data-role="lfile-toggle"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = btn.getAttribute("data-at");
          var list = panelEl.querySelector('[data-role="lfile-list"][data-at="' + at + '"]');
          var open = list.style.display !== "none";
          list.style.display = open ? "none" : "flex";
          btn.classList.toggle("open", !open);
        });
      });
      panelEl.querySelectorAll('[data-role="lfile-open"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = parseFloat(btn.getAttribute("data-at"));
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var l = findLanding(getMotif(), at);
          var imgs = l && (l.images || (l.image ? [l.image] : []));
          if (imgs && imgs[idx]) openImageNewTab(imgs[idx]);
        });
      });
      panelEl.querySelectorAll('[data-role="lfile-attach"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = parseFloat(btn.getAttribute("data-at"));
          pickFile(function (urls, fileName) {
            var l = findLanding(getMotif(), at);
            if (!l) return;
            l.images = urls; l.fileName = fileName;
            save(function () { toast(urls.length > 1 ? "attached (" + urls.length + " pages)" : "attached"); refresh(); });
          });
        });
      });
      panelEl.querySelectorAll('[data-role="lfile-remove"]').forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var at = parseFloat(btn.getAttribute("data-at"));
          var l = findLanding(getMotif(), at);
          if (!l) return;
          l.images = []; l.fileName = null;
          save(function () { toast("file removed"); refresh(); });
        });
      });
    }
    refresh();
  }

  // =========================================================
  // PRACTICE
  // =========================================================
  function phrasesWithMotifs() {
    return phrases.filter(function (p) { return (p.motifs || []).length > 0; });
  }
  function randomPhraseId(excludeId) {
    var pool = phrasesWithMotifs().map(function (p) { return p.id; });
    if (pool.length === 0) return null;
    if (excludeId && pool.length > 1) pool = pool.filter(function (id) { return id !== excludeId; });
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function randomChartId(excludeId) {
    var pool = charts.map(function (c) { return c.id; });
    if (pool.length === 0) return null;
    if (excludeId && pool.length > 1) pool = pool.filter(function (id) { return id !== excludeId; });
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function pickRandomCombos(n) {
    var phrasePool = phrasesWithMotifs().map(function (p) { return p.id; });
    n = Math.min(n, phrasePool.length);
    var picked = [];
    for (var i = 0; i < n; i++) {
      var idx = Math.floor(Math.random() * phrasePool.length);
      var phraseId = phrasePool[idx];
      phrasePool.splice(idx, 1);
      picked.push({ phraseId: phraseId, chartId: randomChartId() });
    }
    return picked;
  }
  function newPull() { currentPull = pickRandomCombos(pullSize); renderPractice(); }

  function renderPractice() {
    var area = document.getElementById("practiceArea");
    area.innerHTML = "";
    var total = phrasesWithMotifs().length;

    if (total === 0) {
      area.innerHTML =
        '<div class="empty"><div class="big">No motifs yet</div>' +
        '<div class="small mono">add a phrase, then add a motif inside it</div></div>';
      return;
    }

    if (currentPull.length === 0) currentPull = pickRandomCombos(pullSize);
    currentPull = currentPull.filter(function (ref) {
      var p = findPhrase(ref.phraseId);
      return p && (p.motifs || []).length > 0;
    });
    if (currentPull.length === 0) currentPull = pickRandomCombos(pullSize);

    currentPull.forEach(function (ref, i) {
      var phrase = findPhrase(ref.phraseId);
      if (!phrase) return;
      // if this combo was built before any charts existed, try again now that charts may exist
      if (!ref.chartId && charts.length > 0) ref.chartId = randomChartId();
      // if this combo's chart was since deleted, drop the stale reference (or pick a new one)
      if (ref.chartId && !findChart(ref.chartId)) ref.chartId = charts.length > 0 ? randomChartId() : null;
      var chart = ref.chartId ? findChart(ref.chartId) : null;
      var comboWrap = document.createElement("div");
      if (i > 0) comboWrap.style.marginTop = "34px";
      comboWrap.className = "combo-wrap";

      // ---- chart half ----
      var chartBlock = document.createElement("div");
      chartBlock.className = "combo-chart-block";
      if (chart) {
        var cimgs = chart.images || [];
        chartBlock.innerHTML =
          '<div class="section-head" style="margin-top:0;"><span class="st">chart</span>' +
          '<button type="button" class="reroll-btn" data-role="reroll-chart">shuffle chart &#8635;</button></div>' +
          '<div class="motif-block">' +
          '<div class="motif-head" data-role="chart-toggle">' +
          '<span class="mname">' + escapeHtml(chart.name || "untitled chart") + '</span>' +
          '<span class="chev">&#9662;</span>' +
          "</div>" +
          '<div class="motif-panel" data-role="chart-panel">' +
          '<div class="motif-image-box" data-role="chart-img"></div>' +
          "</div></div>";
        area.appendChild(comboWrap);
        comboWrap.appendChild(chartBlock);
        var cbox = chartBlock.querySelector('[data-role="chart-img"]');
        if (cimgs.length) {
          cbox.innerHTML = '<img src="' + cimgs[0] + '" alt="chart">';
          cbox.onclick = function () { openImageNewTab(cimgs[0]); };
        } else {
          cbox.innerHTML = '<span class="placeholder">no scan</span>';
        }
        var chartHead = chartBlock.querySelector('[data-role="chart-toggle"]');
        var chartPanel = chartBlock.querySelector('[data-role="chart-panel"]');
        chartHead.addEventListener("click", function () {
          var isOpen = chartPanel.classList.contains("open");
          chartPanel.classList.toggle("open", !isOpen);
          chartHead.classList.toggle("open", !isOpen);
        });
      } else {
        chartBlock.innerHTML =
          '<div class="section-head" style="margin-top:0;"><span class="st">chart</span></div>' +
          '<div class="small mono" style="color:var(--ink-soft); margin-bottom:8px;">no charts added yet</div>';
        area.appendChild(comboWrap);
        comboWrap.appendChild(chartBlock);
      }

      // ---- phrase half ----
      var phraseBlock = document.createElement("div");
      phraseBlock.className = "combo-phrase-block";
      var imgsHtml = "";
      if (phrase.front || phrase.back) {
        imgsHtml = '<div class="detail-imgs">' +
          '<div class="face-static" data-role="p-front"><img src="' + (phrase.front || "") + '" alt="front"></div>' +
          (phrase.back ? '<div class="face-static" data-role="p-back"><img src="' + phrase.back + '" alt="back"></div>' : "") +
          "</div>";
      }
      phraseBlock.innerHTML =
        '<div class="section-head"><span class="st">phrase</span>' +
        '<button type="button" class="reroll-btn" data-role="reroll-phrase">shuffle phrase &#8635;</button></div>' +
        imgsHtml +
        '<div class="meta-name">' + escapeHtml(phrase.name || "untitled phrase") + '</div>' +
        (phrase.from ? '<div class="meta-from mono">' + escapeHtml(phrase.from) + '</div>' : "") +
        '<div class="section-head"><span class="st">motifs</span></div>' +
        '<div data-role="motifs-target"></div>';
      comboWrap.appendChild(phraseBlock);

      var pfront = phraseBlock.querySelector('[data-role="p-front"]');
      if (pfront) pfront.addEventListener("click", function () { openImageNewTab(phrase.front); });
      var pback = phraseBlock.querySelector('[data-role="p-back"]');
      if (pback) pback.addEventListener("click", function () { openImageNewTab(phrase.back); });

      var motifsTarget = phraseBlock.querySelector('[data-role="motifs-target"]');
      var motifs = (phrase.motifs || []).slice().sort(function (a, b) { return a.createdAt - b.createdAt; });
      motifs.forEach(function (m) {
        motifsTarget.appendChild(createMotifAccordionElement(phrase, m.id, { showRemove: false, startOpen: false }));
      });

      var rerollChartBtn = chartBlock.querySelector('[data-role="reroll-chart"]');
      if (rerollChartBtn) rerollChartBtn.addEventListener("click", function () {
        ref.chartId = randomChartId(ref.chartId);
        renderPractice();
      });
      var rerollPhraseBtn = phraseBlock.querySelector('[data-role="reroll-phrase"]');
      rerollPhraseBtn.addEventListener("click", function () {
        var newId = randomPhraseId(ref.phraseId);
        if (newId) ref.phraseId = newId;
        renderPractice();
      });
    });

    var controls = document.createElement("div");
    controls.innerHTML =
      '<div class="practice-controls"><button class="primary" id="newPullBtn">Shuffle new pull</button></div>' +
      '<div class="pull-size"><span>pull&nbsp;</span>' +
      '<button data-n="1" class="' + (pullSize === 1 ? "active" : "") + '">1</button>' +
      '<button data-n="2" class="' + (pullSize === 2 ? "active" : "") + '">2</button></div>';
    area.appendChild(controls);
    document.getElementById("newPullBtn").addEventListener("click", newPull);
    controls.querySelectorAll(".pull-size button").forEach(function (b) {
      b.addEventListener("click", function () {
        pullSize = parseInt(b.getAttribute("data-n"), 10);
        currentPull = [];
        renderPractice();
      });
    });
  }

  function renderPhraseList() {

    var q = phraseSearchQuery.trim().toLowerCase();

      var name = (p.name || "").toLowerCase();
      var motifNames = (p.motifs || []).map(function (m) { return (m.name || "").toLowerCase(); }).join(" ");

    });

  function createMotifAccordionElement(phrase, motifId, opts) {
    opts = opts || {};
    function getMotif() {
      var p = findPhrase(phrase.id);
      return findMotif(p, motifId);
    }
    var motif = getMotif();
    if (!motif) return document.createElement("div");
    var count = (motif.landings || []).length;
    var block = document.createElement("div");
    block.className = "motif-block";
    block.innerHTML =
      '<div class="motif-head' + (opts.startOpen ? " open" : "") + '" data-role="motif-head">' +
      '<span class="mname">' + escapeHtml(motif.name || "untitled motif") + '</span>' +
      '<span class="mcount mono">' + count + (count === 1 ? " landing" : " landings") + '</span>' +
      (opts.showRemove ? '<button type="button" class="lremove" data-role="motif-remove">remove</button>' : "") +
      '<span class="chev">&#9662;</span>' +
      "</div>" +
      '<div class="motif-panel' + (opts.startOpen ? " open" : "") + '" data-role="motif-panel"></div>';

    var head = block.querySelector('[data-role="motif-head"]');
    var panel = block.querySelector('[data-role="motif-panel"]');
    var opened = false;

    function openPanel() {
      if (!opened) {
        wireMotifPanel(panel, phrase, getMotif, function () {
          var m = getMotif();
          var countEl = block.querySelector(".mcount");
          if (m && countEl) {
            var c = (m.landings || []).length;
            countEl.textContent = c + (c === 1 ? " landing" : " landings");
          }
        });
        opened = true;
      }
      panel.classList.add("open");
      head.classList.add("open");
    }

    head.addEventListener("click", function () {
      var isOpen = panel.classList.contains("open");
      if (isOpen) { panel.classList.remove("open"); head.classList.remove("open"); }
      else { openPanel(); }
    });

    if (opts.showRemove) {
      block.querySelector('[data-role="motif-remove"]').addEventListener("click", function (e) {
        e.stopPropagation();
        var self = this;
        confirmClick(self, "tap again to remove", function () {
          var p = findPhrase(phrase.id);
          p.motifs = (p.motifs || []).filter(function (m) { return m.id !== motifId; });
          dbPut(p).then(function () {
            renderCount();
            renderMotifsList(p);
            toast("motif removed");
          }).catch(function () { toast("couldn't save"); });
        });
      });
    }

    if (opts.startOpen) openPanel();
    return block;
  }

  function renderMotifsList(phrase) {

    var motifs = (phrase.motifs || []).slice().sort(function (a, b) { return a.createdAt - b.createdAt; });

      container.innerHTML = '<div class="landings-empty">no motifs added yet</div>';
      return;
    }
    motifs.forEach(function (m) {
      container.appendChild(createMotifAccordionElement(phrase, m.id, { showRemove: true, startOpen: false }));
    });
  }

      keysClean: false, unprompted: false, landings: [],

  function handleAddFormFile(file, isFront) {
    if (!file) return;
    var previewImg = isFront ? frontPreviewImg : backPreviewImg;
    var plusEl = isFront ? frontPlus : backPlus;
    if (isPdfFile(file)) {
      if (!window.pdfjsLib) { toast("PDF reader didn't load \u2014 try a photo instead"); return; }
      toast("reading PDF\u2026");
      var reader = new FileReader();
      reader.onerror = function () { toast("couldn't read that file"); };
      reader.onload = function () {
        var typedarray = new Uint8Array(reader.result);
        pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
          return renderPdfPageToDataUrl(pdf, 1).then(function (page1) {
            if (isFront) {
              pendingFront = page1;
              frontPreviewImg.src = page1; frontPreviewImg.style.display = "block"; frontPlus.style.display = "none";
              if (pdf.numPages >= 2 && !pendingBack) {
                return renderPdfPageToDataUrl(pdf, 2).then(function (page2) {
                  pendingBack = page2;
                  backUploadWrap.style.display = "block"; addBackLink.style.display = "none";
                  backPreviewImg.src = page2; backPreviewImg.style.display = "block"; backPlus.style.display = "none";
                  toast("front & back loaded from PDF");
                });
              }
              toast("front loaded");
            } else {
              pendingBack = page1;
              backPreviewImg.src = page1; backPreviewImg.style.display = "block"; backPlus.style.display = "none";
              toast("back loaded");
            }
          });
        }).catch(function (err) { console.error(err); toast("couldn't read that PDF"); });
      };
      reader.readAsArrayBuffer(file);
    } else {
      fileToCompressedDataURL(file).then(function (dataUrl) {
        if (isFront) pendingFront = dataUrl; else pendingBack = dataUrl;
        previewImg.src = dataUrl; previewImg.style.display = "block"; plusEl.style.display = "none";
      }).catch(function () { toast("couldn't read that photo"); });
    }
  }
  frontInput.addEventListener("change", function () { handleAddFormFile(frontInput.files[0], true); });
  backInput.addEventListener("change", function () { handleAddFormFile(backInput.files[0], false); });

  }

  function openChartDetail(id) {
    var chart = findChart(id);
    if (!chart) return;
    currentChartId = id;
    renderChartDetail();
    document.querySelectorAll("main > section").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById("chartDetail").classList.add("active");
  }

  function renderChartDetail() {
    var chart = findChart(currentChartId);
    if (!chart) return;
    document.getElementById("chartDetailName").textContent = chart.name || "untitled chart";
    var imgs = chart.images || [];
    var mainBox = document.getElementById("chartDetailMainImage");
    if (imgs.length) {
      mainBox.innerHTML = '<img src="' + imgs[0] + '" alt="chart">';
      mainBox.onclick = function () { openImageNewTab(imgs[0]); };
    } else {
      mainBox.innerHTML = '<span class="placeholder">no scan</span>';
      mainBox.onclick = null;
    }
    var extra = document.getElementById("chartDetailExtraPages");
    if (imgs.length > 1) {
      extra.innerHTML = '<div class="attached-files-list">' +
        imgs.slice(1).map(function (u, i) {
          var idx = i + 1;
          var label = chart.fileName ? chart.fileName + " \u00b7 p" + (idx + 1) : "p" + (idx + 1);
          return '<button type="button" class="file-line" data-idx="' + idx + '">' + escapeHtml(label) + '</button>';
        }).join("") + "</div>";
      extra.querySelectorAll(".file-line").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          if (imgs[idx]) openImageNewTab(imgs[idx]);
        });
      });
    } else {
      extra.innerHTML = "";
    }
  }

  document.getElementById("chartDetailBack").addEventListener("click", function () { switchTab("charts"); });

  document.getElementById("deleteChartBtn").addEventListener("click", function () {
    if (!currentChartId) return;
    confirmClick(this, "tap again to confirm delete", function () {
      dbDelete(currentChartId, CHART_STORE).then(function () {
        charts = charts.filter(function (c) { return c.id !== currentChartId; });
        renderCount();
        switchTab("charts");
        toast("chart deleted");
      }).catch(function () { toast("couldn't delete"); });
    });
  });

  // ---------- init ----------
  openDB().then(function (d) {
    db = d;
    return Promise.all([dbGetAll(STORE), dbGetAll(CHART_STORE)]);
  }).then(function (results) {
    var all = results[0], allCharts = results[1];
    var migrated = [];
    var writes = [];
    (all || []).forEach(function (item) {
      var wasFlat = !item.motifs;
      var p = migrateToPhrase(item);
      migrated.push(p);
      if (wasFlat) writes.push(dbPut(p));
    });
    phrases = migrated;
    charts = allCharts || [];
    renderCount();
    renderPractice();
    return Promise.all(writes);
  }).catch(function (err) {
    toast("storage unavailable in this browser");
    console.error(err);
  });

})();
</script>
</body>
</html>
